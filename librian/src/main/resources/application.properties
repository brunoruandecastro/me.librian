server.port=8080
server.error.include-message=always

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:librian}}
spring.datasource.username=${DB_USER:librian_user}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:}

librian.jwt.secret=${JWT_SECRET:librian-dev-secret-key-change-me-in-production-32chars}
librian.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
librian.jwt.setup-expiration-ms=${JWT_SETUP_EXPIRATION_MS:900000}
librian.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
librian.frontend-url=${FRONTEND_URL:http://localhost:3000}
librian.magic-link.expiration-minutes=${MAGIC_LINK_EXPIRATION_MINUTES:30}
librian.magic-link.expose-in-response=${MAGIC_LINK_EXPOSE_IN_RESPONSE:false}

librian.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
librian.google-books.base-url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
librian.google-books.max-results=${GOOGLE_BOOKS_MAX_RESULTS:12}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
